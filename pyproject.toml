[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ir"
version = "0.1.0"
description = "Reproducible research framework for evaluating sparse, dense, and hybrid retrieval with evidence completeness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = []
testpaths = ["tests"]
